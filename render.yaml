# Render Blueprint — single web service.
# Deploy via Render Dashboard: New → Blueprint → connect this repo.
# Fill the `sync: false` secrets in the Render dashboard after the service
# is created (they are intentionally NOT committed here).

services:
  - type: web
    name: ai-planner
    runtime: node
    plan: free
    rootDir: .
    buildCommand: cd frontend && npm ci && npm run build && cd ../backend && npm ci
    startCommand: cd backend && node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Supabase (backend service-role client)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Supabase (frontend, public anon key — required at build time)
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # AI provider (OpenRouter)
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: AI_API_KEY
        sync: false
